# Baut eine installierbare APK.
#
# Laeuft bei jedem Push auf den Entwicklungszweig und laesst sich auch von
# Hand starten. Das Ergebnis haengt als Datei an einer Veroeffentlichung, damit
# es sich direkt auf dem Handy herunterladen laesst.
#
# Die APK ist eine Testfassung. Sie ist mit dem Standardschluessel von Android
# signiert, laesst sich also ohne Konto installieren und bei jedem neuen Bau
# ueber die alte druebersetzen.

name: APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tower-defence-mobile-concept-som680

permissions:
  contents: write

jobs:
  apk:
    name: Debug-APK
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Pruefungen
        run: npm run check

      - name: Weboberflaeche bauen
        run: npm run build

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Bewusst ohne android-actions/setup-android: die Aktion versucht das
      # Paket 'tools' zu installieren, das es nicht mehr gibt. Das SDK ist auf
      # dem Laeufer ohnehin vorhanden, es fehlen nur die Lizenzen.
      - name: Android-SDK bereitstellen
        run: |
          set -euo pipefail
          echo "SDK liegt in $ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Fehlt ein Paket, laedt es das Android-Gradle-Plugin selbst nach.
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Weboberflaeche in das Android-Projekt uebertragen
        run: npx cap sync android

      - name: APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        id: apk
        run: |
          QUELLE=android/app/build/outputs/apk/debug/app-debug.apk
          ZIEL=towerdefender-${{ github.run_number }}.apk
          cp "$QUELLE" "$ZIEL"
          echo "pfad=$ZIEL" >> "$GITHUB_OUTPUT"
          ls -la "$ZIEL"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: towerdefender-apk
          path: ${{ steps.apk.outputs.pfad }}
          retention-days: 30

      - name: Veroeffentlichung aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Eine feste Marke, damit der Link immer derselbe bleibt.
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            --title "TowerDefender APK" \
            --notes "Testfassung, Bau ${{ github.run_number }}. Zum Installieren auf dem Handy herunterladen und die Installation aus unbekannter Quelle einmalig erlauben." \
            --target "${{ github.sha }}" \
            "${{ steps.apk.outputs.pfad }}"

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#cbbfa8" />
    <title>TowerDefender · Werkstatt</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #cbbfa8; }
      body { font: 500 13px/1.4 system-ui, sans-serif; color: #2b2419; }
      #buehne { position: absolute; inset: 0; touch-action: none; }
      #buehne canvas { display: block; width: 100%; height: 100%; }
      #kopf {
        position: absolute; top: 0; left: 0; right: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-top));
        pointer-events: none; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      }
      #kopf b { font-size: 15px; }
      #kopf span { color: #5d5343; }
      #schilder {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; padding: 0 0 calc(14px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #schilder div { flex: 1; text-align: center; color: #4a4133; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="buehne"></div>
    <div id="kopf">
      <b>Werkstatt</b> <span>· dieselbe Beleuchtung, dasselbe Material, dasselbe Huellenverfahren</span>
    </div>
    <div id="schilder">
      <div>aus Quadern</div>
      <div>aus Eiern und Wuersten</div>
    </div>
    <script type="module" src="./werkstatt.ts"></script>
  </body>
</html>

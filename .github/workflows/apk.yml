# Baut eine installierbare APK.
#
# Laeuft bei jedem Push auf den Entwicklungszweig und laesst sich auch von
# Hand starten. Das Ergebnis haengt als Datei an einer Veroeffentlichung, damit
# es sich direkt auf dem Handy herunterladen laesst.
#
# Gebaut wird die Release-Fassung, nicht die Debug-Fassung. Eine Debug-Fassung
# traegt android:debuggable="true" im Manifest, und daran erkennen Play Protect
# und Kinderschutz-Dienste eine App, die sie gern wieder entfernen.
#
# Signiert wird mit dem festen Schluessel aus android/schluessel. Der muss fest
# sein: sonst legt Gradle auf jedem Laeufer einen neuen an, und Android
# verweigert das Update, weil die Signatur nicht zur installierten App passt.
# Die Baunummer wird als versionCode durchgereicht, damit jede Fassung neuer
# ist als die vorige.

name: APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tower-defence-mobile-concept-som680

permissions:
  contents: write

jobs:
  apk:
    name: Release-APK
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Pruefungen
        run: npm run check

      - name: Weboberflaeche bauen
        # Die Fassung steht spaeter im Hauptmenue. Sie traegt die Herkunft mit,
        # weil App und Webfassung getrennt gezaehlt werden und sonst zwei
        # verschiedene Staende dieselbe Nummer truegen.
        env:
          VITE_FASSUNG: App 1.0.${{ github.run_number }}
        run: npm run build

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Bewusst ohne android-actions/setup-android: die Aktion versucht das
      # Paket 'tools' zu installieren, das es nicht mehr gibt. Das SDK ist auf
      # dem Laeufer ohnehin vorhanden, es fehlen nur die Lizenzen.
      - name: Android-SDK bereitstellen
        run: |
          set -euo pipefail
          echo "SDK liegt in $ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Fehlt ein Paket, laedt es das Android-Gradle-Plugin selbst nach.
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Weboberflaeche in das Android-Projekt uebertragen
        run: npx cap sync android

      - name: APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      # Alles, was sonst erst auf dem Handy auffaellt, und dann steht man vor
      # einer App, die sich nicht installieren laesst oder wieder verschwindet.
      #
      # Die Pruefungen sammeln ihre Ergebnisse und melden am Ende alle Fehler
      # auf einmal. Ein Abbruch beim ersten Fehler verschweigt die anderen.
      - name: Fertige APK pruefen
        run: |
          set -uo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          # sort -V, sonst waehlt die Sortierung 9.0.0 statt 36.0.0.
          WERKZEUGE="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          echo "Build-Tools: $WERKZEUGE"

          "$WERKZEUGE/apksigner" verify --verbose --print-certs "$APK" > signatur.txt 2>&1 || true
          "$WERKZEUGE/aapt2" dump badging "$APK" > eigenschaften.txt 2>&1 || true
          echo "--- Signatur ---"; cat signatur.txt
          # Nur die Zeilen zeigen, auf die es ankommt: die Liste der
          # Beschriftungen je Sprache ist hundert Zeilen lang und hilft nicht.
          echo "--- Eigenschaften ---"
          grep -vE "^application-label-" eigenschaften.txt

          fehler=0
          # muss <Beschreibung> <Muster> <Datei>
          muss() {
            if grep -qE "$2" "$3"; then
              echo "  ok       $1"
            else
              echo "  FEHLT    $1   (Muster: $2)"; fehler=1
            fi
          }
          darfNicht() {
            if grep -qE "$2" "$3"; then
              echo "  FEHLER   $1   (Muster: $2)"; fehler=1
            else
              echo "  ok       $1"
            fi
          }
          # sollte: nur ein Hinweis. Fuer Dinge, deren Schreibweise sich mit den
          # Build-Tools aendert - daran soll kein Bau scheitern.
          sollte() {
            if grep -qE "$2" "$3"; then
              echo "  ok       $1"
            else
              echo "  HINWEIS  $1 nicht gefunden   (Muster: $2)"
            fi
          }

          echo "--- Pruefungen ---"
          ERWARTET="$(keytool -list -keystore android/schluessel/towerdefender.keystore \
            -storepass towerdefender -alias towerdefender \
            | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | tr -d ':' | tr 'A-F' 'a-f')"
          muss "signiert mit dem Schluessel aus dem Repo" "$ERWARTET" signatur.txt
          # v1 (JAR-Signatur) braucht nur Android vor 7. Die App verlangt
          # Android 7, also laesst das Gradle-Plugin v1 zu Recht weg.
          muss "v2-Signatur" "v2 scheme \(APK Signature Scheme v2\): true" signatur.txt
          muss "v3-Signatur" "v3 scheme \(APK Signature Scheme v3\): true" signatur.txt

          muss "Fassungsnummer ${{ github.run_number }}" "versionCode='${{ github.run_number }}'" eigenschaften.txt
          muss "laeuft ab Android 7"        "minSdkVersion:'24'" eigenschaften.txt
          # Verhindert, dass die App auf einer Speicherkarte landet und
          # verschwindet, sobald die nicht eingebunden ist.
          muss "nur interner Speicher"      "install-location:'internalOnly'" eigenschaften.txt
          # Eine Debug-Fassung raeumen Play Protect und Kinderschutz gern weg.
          darfNicht "keine Debug-Fassung"   "application-debuggable" eigenschaften.txt
          # Tablets: alle Groessen, und der Touchscreen darf keine Bedingung
          # fuer die Installation sein.
          muss "unterstuetzt grosse Bildschirme" "supports-screens:.*'xlarge'" eigenschaften.txt
          muss "unterstuetzt alle Punktdichten"  "supports-any-density: 'true'" eigenschaften.txt
          # Die Schreibweise der Zeile hat sich zwischen den Build-Tools
          # geaendert, deshalb absichtlich locker gefasst.
          sollte "Touchscreen nicht erzwungen"   "uses-feature-not-required:.*android\\.hardware\\.touchscreen" eigenschaften.txt
          darfNicht "kein Ausschluss von Bildschirmgroessen" "^compatible-screens" eigenschaften.txt

          if [ "$fehler" -ne 0 ]; then
            echo "Die APK haette auf Geraeten Aerger gemacht. Bau abgebrochen."
            exit 1
          fi
          echo "Alle Pruefungen bestanden."

      - name: APK umbenennen
        id: apk
        run: |
          QUELLE=android/app/build/outputs/apk/release/app-release.apk
          ZIEL=towerdefender-${{ github.run_number }}.apk
          cp "$QUELLE" "$ZIEL"
          echo "pfad=$ZIEL" >> "$GITHUB_OUTPUT"
          ls -la "$ZIEL"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: towerdefender-apk
          path: ${{ steps.apk.outputs.pfad }}
          retention-days: 30

      - name: Veroeffentlichung aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Der Text der Veroeffentlichung steht in einer Datei. Mehrzeilig
          # direkt im Befehl geht nicht: eine Zeile ohne Einrueckung beendet
          # den YAML-Block, und GitHub liest den Auftrag dann gar nicht erst.
          cat > hinweise.md <<'ENDE'
          Testfassung, Bau ${{ github.run_number }} (Version 1.0.${{ github.run_number }}).

          Zum Installieren auf dem Handy herunterladen und die Installation aus
          unbekannter Quelle einmalig erlauben.

          **Wer Bau 1 bis 4 installiert hat, muss einmal deinstallieren.** Diese
          Fassungen waren mit jeweils neu erzeugten Schluesseln signiert; Android
          erlaubt ein Update nur bei gleicher Signatur. Der Spielstand geht dabei
          verloren. Ab dieser Fassung wird mit einem festen Schluessel signiert,
          Updates laufen also normal durch.
          ENDE
          cat hinweise.md

          # Eine feste Marke, damit der Link immer derselbe bleibt.
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            --title "TowerDefender APK" \
            --notes-file hinweise.md \
            --target "${{ github.sha }}" \
            "${{ steps.apk.outputs.pfad }}"
